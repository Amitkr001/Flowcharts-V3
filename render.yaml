services:
  - type: web
    name: flowcharts
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.6.0
      - key: PORT
        value: 10000
      - key: MONGO_URL
        sync: false # Set this in Render dashboard
      - key: MONGO_DB
        value: flowcharts
      - key: JWT_SECRET
        generateValue: true
      - key: RECORD
        value: BTCUSD,ETHUSD,SOLUSD,DEMO # Limited symbols to fit Render 512MB RAM
      - key: HISTORY_HOURS
        value: 4
